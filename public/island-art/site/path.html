<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Path · AI Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,0..100&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap">
<link rel="stylesheet" href="site.css">
<style>
.p-hero{min-height:calc(92svh - 68px);display:grid;align-items:center;padding-block:48px;overflow:hidden;
  background:radial-gradient(50% 60% at 78% 50%,color-mix(in oklab,var(--hue) 20%,transparent),transparent 70%)}
.p-hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,72px);align-items:center}
.p-hero h1{margin-bottom:22px}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.fact{padding:10px 16px;border-radius:12px;border:1px solid var(--line-2);background:rgba(23,19,27,.6)}
.fact b{display:block;font:600 22px/1.1 var(--serif)}.fact span{font-size:13px;color:var(--muted)}
.p-art{position:relative;aspect-ratio:4/5;width:min(100%,520px);justify-self:center}
.p-art .frame{position:absolute;inset:0}
.p-art spatial-photo{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto}
.p-art.cut::before{content:"";position:absolute;inset:10%;border-radius:50%;background:radial-gradient(closest-side,color-mix(in oklab,var(--hue) 30%,transparent),transparent);filter:blur(14px)}
.p-art .cap{position:absolute;left:0;right:0;bottom:-46px}
@media (max-width:900px){.p-hero .wrap{grid-template-columns:1fr}.p-art{width:min(100%,400px)}}

.subnav{position:sticky;top:68px;transition:top var(--t-2) var(--ease);z-index:20;border-block:1px solid var(--line);background:color-mix(in oklab,var(--ink) 85%,transparent);backdrop-filter:blur(12px)}
.subnav .wrap{display:flex;gap:4px;overflow:auto;scrollbar-width:none}
.nav.hide ~ main .subnav{top:0}
.subnav a{flex:none;text-decoration:none;font:500 14px var(--sans);color:var(--ivory-2);padding:14px 14px;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.subnav a.on,.subnav a:hover{color:var(--ivory);border-color:var(--hue)}

.quote{font:500 clamp(24px,2.6vw,34px)/1.35 var(--serif);letter-spacing:-.01em;max-width:30ch;margin:0 0 28px}
.quote::before{content:"“";color:var(--hue);margin-right:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.list-card{padding:26px 28px}
.list-card ul{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:14px}
.list-card li{display:grid;grid-template-columns:22px 1fr;gap:10px;color:var(--ivory-2)}
.list-card li svg{width:20px;height:20px;margin-top:3px}

/* route timeline */
.route{position:relative;display:grid;gap:14px;padding-left:64px}
.route::before{content:"";position:absolute;left:27px;top:20px;bottom:20px;width:2px;background:var(--line)}
.route .fill{position:absolute;left:27px;top:20px;width:2px;height:calc((100% - 40px) * var(--rp,0));background:var(--hue);box-shadow:0 0 12px var(--hue)}
.stop{position:relative;display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:22px;align-items:center;padding:16px;border-radius:var(--r-3);text-decoration:none;
  border:1px solid var(--line);background:linear-gradient(180deg,var(--panel-2),var(--panel));transition:transform .4s var(--ease),border-color .3s,box-shadow .3s}
.stop:hover{transform:translateX(6px);border-color:color-mix(in oklab,var(--c) 60%,transparent);box-shadow:0 20px 50px -30px var(--c)}
.stop .dot{position:absolute;left:-46px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--ink);border:2px solid var(--c);box-shadow:0 0 0 4px var(--ink)}
.stop.done .dot{background:#4ADE80;border-color:#4ADE80}
.stop .th{width:120px;aspect-ratio:16/10;border-radius:12px;overflow:hidden}
.stop .th img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.stop:hover .th img{transform:scale(1.08)}
.stop .k{font:600 11.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.stop h3{font-size:22px;margin:4px 0 6px}
.stop p{margin:0;font-size:15px;color:var(--ivory-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stop .hrs{font:600 13px var(--mono);color:var(--muted);white-space:nowrap}
.shared{font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:6px 0 0}
@media (max-width:700px){.route{padding-left:36px}.route::before,.route .fill{left:11px}.stop .dot{left:-32px}.stop{grid-template-columns:1fr}.stop .th{width:100%}}

/* effort dials */
.dials{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap)}
@media (max-width:860px){.dials{grid-template-columns:repeat(2,1fr)}}
.dial{padding:22px;text-align:center}
.dial svg{width:100%;max-width:180px;margin:0 auto 6px;display:block;overflow:visible}
.dial .needle{transform-origin:100px 100px;transform:rotate(-90deg);transition:transform 1.6s cubic-bezier(.3,1.4,.5,1)}
.dial.in .needle{transform:rotate(calc(-90deg + var(--v) * 36deg))}
.dial h3{font-size:20px}.dial p{font-size:14px;color:var(--ivory-2);margin:6px 0 0}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--gap)}
.stat{padding:24px 26px;display:grid;gap:12px;align-content:start}
.stat p{margin:0;font-size:16px;color:var(--ivory)}
.stat a{font:500 12.5px var(--mono);color:var(--muted)}
.roles{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 28px}
.roles span{padding:8px 14px;border-radius:999px;border:1px solid color-mix(in oklab,var(--hue) 50%,transparent);font-size:14px}

.pn{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.pn a{padding:22px 26px;display:grid;gap:6px}
.pn a.next{text-align:right}
.pn small{font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pn b{font:600 24px var(--serif)}
</style>
</head>
<body>
<main id="main">
  <section class="p-hero" aria-labelledby="ph"><div class="wrap">
    <div>
      <p class="eyebrow" id="pEye" data-reveal></p>
      <h1 id="ph" data-reveal style="--d:80ms"></h1>
      <p class="lede" id="pBlurb" data-reveal style="--d:160ms"></p>
      <div class="cta" style="display:flex;gap:12px;flex-wrap:wrap;margin-top:30px;--d:240ms" data-reveal>
        <a class="btn" id="pStart" href="#">Start the first island</a><a class="btn ghost" href="#route">See the route</a></div>
      <div class="facts" id="pFacts" data-reveal style="--d:320ms"></div>
    </div>
    <figure class="p-art" id="pArt" style="margin:0" data-reveal="fade"></figure>
  </div></section>

  <nav class="subnav" aria-label="On this page"><div class="wrap">
    <a href="#overview">Overview</a><a href="#route">Route</a><a href="#effort">Effort</a><a href="#careers">Careers</a></div></nav>

  <section class="sec" id="overview" aria-labelledby="ov-h"><div class="wrap">
    <p class="eyebrow" data-reveal>What you'll be able to build</p>
    <h2 id="ov-h" class="sr">Overview</h2>
    <p class="quote" id="pBuild" data-reveal></p>
    <p class="lede" id="pFit" data-reveal style="margin-bottom:40px"></p>
    <div class="two">
      <div class="card list-card" data-reveal><h3>Why take it</h3><ul id="pBen"></ul></div>
      <div class="card list-card" data-reveal style="--d:100ms"><h3>What it costs you</h3><ul id="pTrade"></ul></div>
    </div>
  </div></section>

  <section class="sec" id="route" style="padding-top:0" aria-labelledby="rt-h"><div class="wrap">
    <p class="eyebrow" data-reveal>The route</p>
    <h2 id="rt-h" data-reveal style="margin-bottom:36px">Island by island</h2>
    <div class="route" id="pRoute"><div class="fill"></div></div>
  </div></section>

  <section class="sec" id="effort" style="padding-top:0" aria-labelledby="ef-h"><div class="wrap">
    <p class="eyebrow" data-reveal>Effort</p>
    <h2 id="ef-h" data-reveal style="margin-bottom:36px">What it will take</h2>
    <div class="dials" id="pDials"></div>
  </div></section>

  <section class="sec" id="careers" style="padding-top:0" aria-labelledby="cr-h"><div class="wrap">
    <p class="eyebrow" data-reveal>Careers</p>
    <h2 id="cr-h" data-reveal>Where it leads</h2>
    <div class="roles" id="pRoles" data-reveal></div>
    <div class="stats" id="pStats"></div>
  </div></section>

  <section class="sec" style="padding-top:0"><div class="wrap pn" id="pNav"></div></section>
</main>

<script type="module">
import { data, chrome, motion, esc, asset, spatial, setHue, creditLine } from "./site.js";
chrome("path");
const D = await data(); const A = D.atlas;
const KEY = "ai-atlas-progress"; const done = (() => { try { return JSON.parse(localStorage.getItem(KEY))?.done || []; } catch { return []; } })();
const ROM = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"];
const ICON = { ok: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--hue)"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
  tr: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted)"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>` };

let cur = "understand";
function render() {
  const h0 = location.hash.slice(1); if (A.order.includes(h0)) cur = h0; const k = cur;
  const p = A.paths[k], info = A.info[k], img = D.pageBy["path-" + k], c = A.pathHue[k], i = A.order.indexOf(k);
  setHue(c); document.title = `${p.name} · AI Atlas`;
  const hrs = D.pathHours(k);
  document.getElementById("pEye").textContent = `Path ${ROM[i]} · ${i < 4 ? "Goal" : "Specialisation"}`;
  document.getElementById("ph").textContent = p.name;
  document.getElementById("pBlurb").textContent = p.blurb;
  const first = p.steps.find((s) => !done.includes(s)) || p.steps[0];
  document.getElementById("pStart").href = `island.html#${first}`;
  document.getElementById("pFacts").innerHTML = [[p.steps.length, "islands"], [`${hrs[0]}–${hrs[1]}`, "hours"], [`${Math.ceil(hrs[0] / 10)}–${Math.ceil(hrs[1] / 10)}`, "weeks at 10 h/week"]]
    .map(([b, s]) => `<div class="fact"><b>${b}</b><span>${s}</span></div>`).join("");
  const art = document.getElementById("pArt"); art.className = "p-art " + (img.kind === "cutout" ? "cut" : "");
  art.innerHTML = (img.kind === "cutout" ? spatial({ ...img, hue: c }, 'mode="pointer" intro bg="#0C0A0D"')
    : `<div class="frame">${spatial({ ...img, hue: c, files: { hero: img.files.tall, heroDepth: img.files.tallDepth } }, 'mode="pointer" intro')}</div>`)
    + `<figcaption class="credit cap">${creditLine(img.artwork)}</figcaption>`;
  document.getElementById("pBuild").textContent = info.build;
  document.getElementById("pFit").textContent = info.fit;
  document.getElementById("pBen").innerHTML = info.benefits.map((b) => `<li>${ICON.ok}<span>${esc(b)}</span></li>`).join("");
  document.getElementById("pTrade").innerHTML = info.tradeoffs.map((b) => `<li>${ICON.tr}<span>${esc(b)}</span></li>`).join("");
  // route
  const core = ["S0", "S1", "S2", "S3", "S4"];
  let html = '<div class="fill"></div>', sharedShown = false, ownShown = false;
  p.steps.forEach((id, n) => { const is = D.isl[id], a = D.artBy[id], c2 = D.hue(id);
    if (core.includes(id) && !sharedShown) { html += `<p class="shared">Shared foundation</p>`; sharedShown = true; }
    if (!core.includes(id) && !ownShown && sharedShown) { html += `<p class="shared">${esc(p.name)}</p>`; ownShown = true; }
    html += `<a class="stop ${done.includes(id) ? "done" : ""}" href="island.html#${id}" style="--c:${c2}" data-reveal>
      <span class="dot"></span><span class="th"><img src="${asset(a.files.hero)}" alt="" loading="lazy"></span>
      <span><span class="k">Step ${String(n + 1).padStart(2, "0")} · Island ${D.num(id)}</span><h3>${esc(is.title)}</h3><p>${esc(is.learn)}</p></span>
      <span class="hrs">${is.hrs[0]}–${is.hrs[1]} h</span></a>`; });
  document.getElementById("pRoute").innerHTML = html;
  // effort dials
  const N = { math: "Math", code: "Code", gpu: "GPU", money: "Money" };
  document.getElementById("pDials").innerHTML = Object.entries(info.effort).map(([e, [v, note]]) => `<div class="card dial" data-dial style="--v:${v}">
    <svg viewBox="0 0 200 120" aria-hidden="true"><path d="M20 100a80 80 0 0 1 160 0" fill="none" stroke="rgba(243,235,221,.12)" stroke-width="10" stroke-linecap="round"/>
      <path d="M20 100a80 80 0 0 1 160 0" fill="none" stroke="var(--hue)" stroke-width="10" stroke-linecap="round" pathLength="5" stroke-dasharray="${v} 5" style="filter:drop-shadow(0 0 6px var(--hue))"/>
      ${[0, 1, 2, 3, 4, 5].map((t) => { const a = Math.PI * (1 - t / 5); return `<line x1="${100 + Math.cos(a) * 64}" y1="${100 - Math.sin(a) * 64}" x2="${100 + Math.cos(a) * 70}" y2="${100 - Math.sin(a) * 70}" stroke="rgba(217,178,106,.6)"/>`; }).join("")}
      <g class="needle"><line x1="100" y1="100" x2="100" y2="34" stroke="var(--gold-2)" stroke-width="2.5" stroke-linecap="round"/><circle cx="100" cy="100" r="6" fill="var(--gold)"/></g></svg>
    <h3>${N[e]} <span class="mono" style="color:var(--hue);font-size:15px">${v}/5</span></h3><p>${esc(note)}</p></div>`).join("");
  const dio = new IntersectionObserver((es) => es.forEach((x) => x.isIntersecting && x.target.classList.add("in")), { threshold: .4 });
  document.querySelectorAll("[data-dial]").forEach((d) => dio.observe(d));
  // careers
  document.getElementById("pRoles").innerHTML = info.roles.map((r) => `<span>${esc(r)}</span>`).join("");
  document.getElementById("pStats").innerHTML = info.demand.map((d, j) => `<div class="card stat" data-reveal style="--d:${j * 80}ms"><p>${esc(d.t)}</p><a href="${d.u}" target="_blank" rel="noopener">${esc(d.s)} ↗</a></div>`).join("");
  // prev / next
  const pv = A.order[(i + 9) % 10], nx = A.order[(i + 1) % 10];
  document.getElementById("pNav").innerHTML = `<a class="card" href="path.html#${pv}" style="--hue:${A.pathHue[pv]}"><small>← Previous path</small><b>${esc(A.paths[pv].name)}</b></a>
    <a class="card next" href="path.html#${nx}" style="--hue:${A.pathHue[nx]}"><small>Next path →</small><b>${esc(A.paths[nx].name)}</b></a>`;
}
render();
addEventListener("hashchange", () => { if (A.order.includes(location.hash.slice(1))) { render(); scrollTo({ top: 0 }); } });

// route line fills as you scroll; sub-nav highlights the section in view
const route = () => document.getElementById("pRoute");
addEventListener("scroll", () => { const r = route().getBoundingClientRect(); const p = Math.min(1, Math.max(0, (innerHeight * .6 - r.top) / r.height)); route().style.setProperty("--rp", p); }, { passive: true });
const links = [...document.querySelectorAll(".subnav a")];
const sio = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) links.forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id)); }), { rootMargin: "-40% 0px -55% 0px" });
["overview", "route", "effort", "careers"].forEach((id) => sio.observe(document.getElementById(id)));
motion();
</script>
</body>
</html>
